<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Portfolio – Harry DEGBEGNI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Harry DEGBEGNI</h1>
    <p>Photographe amateur – Paysages & Portraits</p>
    <a href="https://instagram.com/_look_up_hry" target="_blank" class="btn">📸 Instagram</a>
    <a href="contact.html" class="btn">✉️ Contact</a>
  </header>

  <main>
    <section class="about">
      <h2>À propos</h2>
      <p>Passionné de photographie, je capture paysages, portraits et instants uniques. Ce site présente une sélection de mes clichés.</p>
    </section>

    <section class="gallery">
      <h2>Galerie</h2>
      <div class="grid" id="gallery-grid">
        <!-- Les images seront insérées ici -->
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Harry DEGBEGNI – Portfolio</p>
  </footer>

  <script>
    const gallery = document.getElementById('gallery-grid');

    // Boucle de 1 à 9
    for (let i = 1; i <= 12; i++) {
      const img = document.createElement('img');
      img.src = `photos/photo${i}.JPG`;
      img.alt = `Photo ${i}`;
      img.loading = 'lazy'; // optimisation du chargement
      gallery.appendChild(img);
    }
  </script>
</body>
</html>
